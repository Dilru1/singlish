name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-luatex
      - name: Run transliteration tests
        run: texlua tests/run.lua
